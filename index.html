<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Finance Tracker</title>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <header>
      <h1>Student Finance Tracker</h1>
      <nav>
        <ul>
          <li><a href="#dashboard">Dashboard</a></li>
          <li><a href="#records-table">Records Table</a></li>
          <li><a href="#add">Add Expense</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#settings">Settings</a></li>
        </ul>
      </nav>
    </header>
    <main id="main">
      <section id="dashboard" aria-labelledby="dashboard-title">
        <h2 id="dashboard-title">Dashboard</h2>
      </section>
      <section id="records-table" aria-labelledby="records-table-title">
        <h2 id="records-table-title">Records Table</h2>
      </section>
      <section id="add" aria-labelledby="add-title">
        <h2 id="add-title">Add Expense</h2>
        <form id="expense-form">
          <div class="field">
            <label for="description">Description</label>
            <input
              type="text"
              id="description"
              name="description"
              aria-describedby="description-error"
            />
            <p id="description-error" class="error"></p>
          </div>
          <div class="field">
            <label for="amount">Amount (RWF)</label>
            <input
              type="text"
              id="amount"
              name="amount"
              inputmode="decimal"
              aria-describedby="amount-error"
            />
            <p id="amount-error" class="error"></p>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select
              name="category"
              id="category"
              aria-describedby="category-error"
            >
              <option value="">Choose a Category</option>
              <option value="Food">Food</option>
              <option value="Books">Books</option>
              <option value="Transport">Transport</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Fees">Fees</option>
              <option value="Other">Other</option>
            </select>
            <p id="category-error" class="error"></p>
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input
              type="date"
              id="date"
              name="date"
              aria-describedby="date-error"
            />
            <p id="date-error" class="error"></p>
          </div>
          <div class="actions">
            <button type="submit">Save</button>
            <button type="button">Cancel</button>
          </div>
        </form>
      </section>
      <section id="about" aria-labelledby="about-title">
        <h2 id="about-title">About</h2>
      </section>
      <section id="settings" aria-labelledby="settings-title">
        <h2 id="settings-title">Settings</h2>
      </section>
    </main>
  </body>
</html>
